version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - react
          - react-dom
          - lucide-react
      tooling:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - "@playwright/test"
