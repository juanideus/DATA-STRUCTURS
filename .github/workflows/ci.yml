name: Validación

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configurar Node.js
        # https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            report/package-lock.json

      - name: Verificar versión segura de Node.js
        run: node -e "const fs = require('node:fs'); const expected = fs.readFileSync('.nvmrc', 'utf8').trim(); if (process.versions.node !== expected) { console.error('Se esperaba Node.js ' + expected + ', pero se está usando ' + process.versions.node); process.exit(1); }"

      - name: Probar el detector de secretos
        run: node --test scripts/secret-scanner.test.mjs

      - name: Revisar secretos en archivos e historial Git
        run: node scripts/audit-secrets.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de la API de reportes
        run: npm ci --prefix report

      - name: Probar regresiones de coherencia
        env:
          DSA_TREE_JAVA: java
          DSA_TREE_CXX: g++
        run: node --test tests/regressions/*.test.mjs

      - name: Auditar catálogo
        run: npm run audit

      - name: Revisar vulnerabilidades
        run: npm run audit:dependencies

      - name: Probar seguridad de la API de reportes
        run: npm run test:report

      - name: Probar recuperación y privacidad del cliente
        run: npm run test:security-client

      - name: Compilar producción
        run: npm run build

      - name: Revisar secretos en los archivos publicados
        run: node scripts/audit-secrets.mjs --artifacts-only

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de navegador
        run: npm run test:e2e
